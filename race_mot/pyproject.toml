[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race-mot"
version = "0.1.0"
description = "Local edge multi-object tracking prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
evaluation = ["trackeval==1.3.0"]

[project.scripts]
race-mot = "race_mot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
